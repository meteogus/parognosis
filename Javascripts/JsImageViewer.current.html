<script type="text/javascript">
//==================================
// * * * * * * * * * * * * * * * *

//==================================

// define some variables  -- No Need to alter these!!!

  var row = initial_image;
  
  	theImages = new Array();
  			for (var i = 1 ;  i<no_of_vars+1; i++){
  		theImages[i] = new Array();
  	}
  		
	var loop = true
	var animate = false   /// changed
	var reverse = false
	var delay_time=200;
	plots = theImages[1];
	plots.value = 1;
 var plotsold=plots.value;   //~
 var rowold=row;  //~
	
 
//  lots and lots of functions
 function incrementRow(rinc,pinc){ 
    if(reverse==true){rinc = rinc*-1.0}
      rowold = row;
      plotsold = plots.value;
      if(pinc != 0){ 
        if( ((plotsold+pinc) <= no_of_vars)&& (plotsold+pinc) >= 1){ 
            i = plotsold+pinc;
            plots = theImages[i];
            plots.value = i;
        } 
      } 
      row = row+(rinc*increment);
      if(row > last_image){   row=first_image;  } 
      else if(row < first_image){  row=last_image;   } 
     refresh_image();   // set new numbers but that image needs to now be displayed. 
 }
 
 
 function refresh_image(){;
     id1=document.getElementById('anim');
     id1.src = plots[row].src;              // set new image. 
     document.myform.inputbox.value = row;      // change value in box on the left. 
} 



function go2image(num){ 
   if(num < last_image && num > first_image){ 
     rowold = row;
     plotsold = plots.value;
     row = num;
     refresh_image();
    }
  }
ie=(document.all)?true:false;

function resetFrame(){ 
     rowold = row;
     plotsold = plots.value;
     plots = theImages[1];
     plots.value=1;
     row = initial_image;
     document.myform.inputbox.value = row;
     refresh_image();
 } 
	
function keyDown(e) { 
    var evt=(e)?e:(window.event)?window.event:null;
    if(evt){ 
       var key=(evt.charCode)?evt.charCode: ((evt.keyCode)?evt.keyCode:((evt.which)?evt.which:0));
        if(key==37){       incrementRow(-1,0) ; return false; } // left key
        else if(key==39){  incrementRow(1,0)  ; return false; } // right key
        else if(key==40){  incrementRow(0,1)  ; return false; } // up key
        else if(key==38){  incrementRow(0,-1) ; return false; } // down key
        else if(key==32){  play()             ; return false; } // space bar
        else if(event.shiftKey && event.keyCode == 82) { forceRefresh(); }  // This is to force a reload of the images but messes with other stuff. ( shift + r ) can be deleted. //
    }
} document.onkeydown=keyDown;
	
	

function showhide(){
	if(document.getElementById('tabOpts').className=='hide'){
		document.getElementById('tabOpts').className='show'
	}
	else if(document.getElementById('tabOpts').className=='show'){
		document.getElementById('tabOpts').className='hide'
	}
}

function launch(){
	if(no_of_vars == 1){
	document.getElementById('tdMultiVar').className = 'hide'
	}
	for (var j = 1; j<=no_of_vars;j++ ){
			
		for (var i = first_image; i <= last_image; i++)  {
			theImages[j][i] = new Image();
			theImages[j][i].src = image_name[j] + i  + image_type;		
		
			
				}
	}

   		document.getElementById('anim').src = plots[initial_image].src	
     	document.myform.inputbox.value = initial_image;
	row = initial_image;	
     	
}


function play(){
    if(animate==false){ 
        animate=true;
        document.getElementById('bPlay').value='stop';
        animateFwd();
    } 
    else if(animate==true){ animate=false;
        clearTimeout(timeID);
        document.getElementById('bPlay').value='play';
    }
} 



function showvar(){
alert('Boo!!' )
}

function submitenter(num,e){ 
    var keycode;
    if (window.event) keycode = window.event.keyCode;
    else if (e) keycode = e.which;
    else{ return true; }
    if (keycode == 13) { go2image(num); return false; }
    else{ return true;}    
} 
	
function chooseLoop(){
	if(loop==true){
		document.getElementById('cbL').checked =false;
		loop=false;
		}
	else if(loop==false){
		document.getElementById('cbL').checked =true;
		loop=true;
		}
}

function animateFwd(){
    animate=true;
    incrementRow(1,0);
    delay = delay_time;
    if(row==last_image){delay = delay_time*lag_mulitplier;}  // lags on last image //
    timeID = setTimeout("animateFwd()", delay); // sleeps for a lil bit then continues to increment //
} 


function chooseRev(){
	if(reverse==true){
		document.getElementById('cbRev').checked =false;
		reverse=false;
		if(animate==true){play();play()}
		}
	else if(reverse==false){
		document.getElementById('cbRev').checked =true;
		reverse=true;
		if(animate==true){play();play()}
		}
}

function showHelp(){
	alert("\
Key				Command\r\
\r\
SpaceBar			Play/Stop\r\
Left Arrow			Backwards\r\
Right Arrow		Forwards\r\
Up Arrow			Change Variable\r\
Down Arrow		Change Variable\r\
\r\
")
	}
	
	
zNum = 1.0
function zoom(num){
	zNum = zNum+num
	document.getElementById('MainImage').style.MozTransform = "scale("+zNum+")";
	document.getElementById('MainImage').style.WebkitTransform = "scale("+zNum+")";
	document.getElementById('MainImage').style.OTransform = "scale("+zNum+")";
	document.getElementById('MainImage').style.zoom = zNum;
	}


function increaseSpeed(){
	if(document.Speedbarform.speedbar.value ==14){
		return false}
	else	
	delay_time=(1000/((1000/delay_time)+1));
	document.Speedbarform.speedbar.value = 1000/delay_time;
}
function decreaseSpeed(){
	if(document.Speedbarform.speedbar.value ==1){
		return false}
	else
	delay_time=(1000/((1000/delay_time)-1));
	document.Speedbarform.speedbar.value = 1000/delay_time;
}

function changeSpeed(num){
	   delay_time=1000/((+num));
	   document.Speedbarform.speedbar.value = 1000/delay_time;
	   }


function disableEnterKey(e){
     var key
     if(window.event){
          key = window.event.keyCode;  }   //IE
     else{
          key = e.which;}     //firefox

     if(key == 13){
     		eval("document.myform.inputbox.focus()");
     		return false;}
          
     else{
          return true;}
}


function forceRefresh(){
	randomx = Math.floor((Math.random()*100)+1);
	document.getElementById('anim').src = "http://www.atmos.albany.edu/student/abrammer/dev/LIVE/loading.gif";
	image_type = image_type+"?v="+randomx;
	launch()
	}



</script>
